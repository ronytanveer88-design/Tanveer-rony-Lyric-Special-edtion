<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d1a">
<link rel="manifest" href="manifest.json">
<title>লিরিক স্টুডিও</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&family=Baloo+Da+2:wght@700&family=Noto+Serif+Bengali:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d1a;--card:#151a2e;--line:#232b4a;--accent:#ff7a3d;--accent2:#ffb347;--ok:#2de18a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8ecff;font-family:'Hind Siliguri',system-ui,sans-serif;padding-bottom:84px}
.top{padding:14px 16px;background:#0a0d1a;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px}
.card h3{margin:0 0 8px;font-size:15px}
label{display:block;font-size:13px;margin:10px 0 4px;color:#9aa6c8}
input,textarea,select{width:100%;background:#0e1224;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;font-size:14px;font-family:inherit}
textarea{min-height:140px}
.btn{border:0;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:14px}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;width:100%;height:48px}
.btn-dark{background:#222845;border:1px solid var(--line);color:#fff;flex:1}
.btn-dark.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border-color:transparent}
.row{display:flex;gap:8px}
.preview{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;position:relative}
.preview canvas{display:block;width:100%;height:100%}
.progress{height:6px;background:#1e2540;border-radius:10px;overflow:hidden;margin:8px 0}
.progress div{height:100%;background:var(--accent);width:0%}
.syncBtn{background:linear-gradient(135deg,#ff7a3d,#ffb347);color:#000;border:0;width:100%;height:52px;border-radius:14px;font-weight:800;font-size:16px;margin:12px 0;font-family:inherit}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#0f1326;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#6c789a;cursor:pointer;padding:6px}
.tab.active{color:var(--accent)} .tab .ic{font-size:20px}
.page{display:none} .page.active{display:block}
#syncList{max-height:240px;overflow:auto}
.ok{color:var(--ok);font-size:12px}
</style>
</head>
<body>
<div class="top"><b>🎵 লিরিক স্টুডিও</b><span style="font-size:10px;color:#8a97b8">৪ ট্যাব</span></div>

<!-- ট্যাব ১ : গান ও লিরিক -->
<div class="page active" id="p1">
<div class="card">
<h3>১. গান বাছাই করো</h3>
<button class="btn btn-dark" onclick="document.getElementById('af').click()" style="width:100%;height:52px">🎵 গান বাছাই করো</button>
<input type="file" id="af" accept="audio/*" hidden>
<div id="audioInfo" style="font-size:12px;color:#8a97b8;margin-top:8px">এখনো গান বাছাই হয়নি</div>
<audio id="au" controls style="width:100%;margin-top:8px;display:none"></audio>
</div>
<div class="card">
<h3>২. লিরিক লেখো</h3>
<textarea id="ly">উজাড় করে দিয়েছিলাম
তবুও তুমি বুঝলে না
বৃষ্টি ভেজা এই রাতে
তোমাকেই খুঁজেছি</textarea>
<button class="btn btn-accent" style="margin-top:8px" onclick="loadLyrics()">✅ লিরিক নিশ্চিত করো</button>
<div id="lineCount" class="ok" style="margin-top:6px"></div>
</div>
</div>

<!-- ট্যাব ২ : সিঙ্ক -->
<div class="page" id="p2">
<div class="card" style="padding:0;overflow:hidden"><div class="preview"><canvas id="c2" width="640" height="360"></canvas></div></div>
<div class="card">
<div class="progress"><div id="prog"></div></div>
<div class="row" style="justify-content:space-between;font-size:13px"><span id="time">0:00.0 / 0:00.0</span><span id="lineInfo">লাইন 0/0</span></div>
<div class="row" style="margin-top:8px"><button class="btn btn-dark" onclick="togglePlay()" id="playBtn">▶ চালাও</button><button class="btn btn-dark" onclick="restart()">⏮ শুরু থেকে</button></div>
<div id="nextLine" style="font-size:13px;color:var(--accent2);margin-top:10px;min-height:18px"></div>
<button class="syncBtn" onclick="markLine()">👉 এই লাইন এখন শুরু</button>
<div class="row"><button class="btn btn-dark" style="font-size:12px" onclick="adjust(-0.1)">-০.১s</button><button class="btn btn-dark" style="font-size:12px" onclick="adjust(0.1)">+০.১s</button><button class="btn btn-dark" style="font-size:12px" onclick="autoSync()">অটো ভাগ</button></div>
<div id="syncMsg" class="ok" style="margin-top:6px"></div>
</div>
<div class="card"><h3>সিংক লিস্ট (Scroll)</h3><div id="syncList"></div></div>
</div>

<!-- ট্যাব ৩ : ডিজাইন -->
<div class="page" id="p3">
<div class="card" style="padding:0;overflow:hidden"><div class="preview"><canvas id="c3" width="640" height="360"></canvas></div></div>
<div class="card"><h3>ব্যাকগ্রাউন্ড</h3><div class="row"><button class="btn btn-dark sel" style="flex:1" id="bgRainBtn" onclick="setBg('rain')">🌧 বৃষ্টি</button><button class="btn btn-dark" style="flex:1" id="bgFileBtn" onclick="document.getElementById('bgFile').click()">🖼 ছবি/ভিডিও</button></div><input type="file" id="bgFile" accept="image/*,video/*" hidden></div>
<div class="card"><h3>স্ক্রিনের মাপ</h3><div class="row"><button class="btn btn-dark sel" style="flex:1" id="r169" onclick="setRatio('16:9')">16:9</button><button class="btn btn-dark" style="flex:1" id="r916" onclick="setRatio('9:16')">9:16</button><button class="btn btn-dark" style="flex:1" id="r11" onclick="setRatio('1:1')">1:1</button></div></div>
<div class="card"><h3>লেখা</h3><label>সাইজ</label><input type="range" id="fontSize" min="14" max="72" value="32" oninput="updateDesign()"><label>অন্ধকার</label><input type="range" id="darkness" min="0" max="85" value="40" oninput="updateDesign()"><label>ফন্ট</label><select id="fontSel" onchange="updateDesign()"><option>Hind Siliguri</option><option>Baloo Da 2</option><option>Noto Serif Bengali</option></select></div>
</div>

<!-- ট্যাব ৪ : ভিডিও -->
<div class="page" id="p4">
<div class="card"><h3>ভিডিও + থাম্বনেইল + ইন্ট্রো/আউটরো</h3>
<label>ইন্ট্রো (৩ সেকেন্ড, ফাঁকা রাখলে বাদ)</label><input id="intro" value="Tanvir Rahman Rony">
<label>আউটরো (৩ সেকেন্ড, ফাঁকা রাখলে বাদ)</label><input id="outro" value="Subscribe">
<div class="row" style="margin-top:10px"><button class="btn btn-accent" id="mkBtn" onclick="makeVideo()" style="height:54px">🎬 ভিডিও বানাও</button></div>
<div class="progress" style="margin-top:10px"><div id="vprog"></div></div>
<div id="vstatus" class="ok"></div>
<video id="rv" controls playsinline style="display:none;width:100%;margin-top:10px;border-radius:12px"></video>
<a id="dl" class="btn btn-accent" style="display:none;margin-top:10px;text-decoration:none">⬇ ভিডিও ডাউনলোড</a>
<button id="shareBtn" class="btn btn-dark" style="display:none;width:100%;margin-top:8px" onclick="shareVideo()">📤 শেয়ার / সেভ</button>
</div>
<div class="card"><div class="row"><button class="btn btn-dark" onclick="saveLRC()">LRC সেভ</button><button class="btn btn-dark" onclick="saveProject()">প্রজেক্ট সেভ</button></div>
<div class="row" style="margin-top:8px"><button class="btn btn-dark" onclick="makeThumbnail()">থাম্বনেইল JPG</button><button class="btn btn-dark" onclick="testAll()">✅ সব টেস্ট করো</button></div>
<textarea id="lrcOut" readonly style="display:none;margin-top:10px"></textarea>
<canvas id="thumb" width="1280" height="720" style="display:none;width:100%;margin-top:10px;border-radius:12px"></canvas>
<div id="testResult" style="margin-top:10px;font-size:12px"></div></div>
</div>

<div class="tabs">
<div class="tab active" onclick="go(1)" id="t1"><span class="ic">🎵</span>গান ও লিরিক</div>
<div class="tab" onclick="go(2)" id="t2"><span class="ic">⏱️</span>সিঙ্ক</div>
<div class="tab" onclick="go(3)" id="t3"><span class="ic">🎨</span>ডিজাইন</div>
<div class="tab" onclick="go(4)" id="t4"><span class="ic">🎬</span>ভিডিও</div>
</div>

<script>
const $=id=>document.getElementById(id);
const audio=$('au'), af=$('af');
let lyrics=[], times=[], curIdx=0, curPage=1;
let bgType='rain', bgMedia=null, bgUrl=null, ratio='16:9';
let audioUrl=null;

// প্রিভিউ আর এক্সপোর্টের মাপ (প্রিভিউয়ের দ্বিগুণ = ভিডিওর মাপ)
const PREV={'16:9':[640,360],'9:16':[360,640],'1:1':[360,360]};
const EXPORT={'16:9':[1280,720],'9:16':[720,1280],'1:1':[720,720]};

/* ---------- ছোট সহায়ক ফাংশন ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function format(s){ if(!isFinite(s)||s<0) s=0; const tn=Math.round(s*10); const m=Math.floor(tn/600); const sec=(tn%600)/10; return m+':'+sec.toFixed(1).padStart(4,'0'); }
function lrcTime(t){ const cs=Math.round(t*100); const p=n=>String(n).padStart(2,'0'); return '['+p(Math.floor(cs/6000))+':'+p(Math.floor((cs%6000)/100))+'.'+p(cs%100)+']'; }
function saveBlob(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),15000); }

/* ---------- ট্যাব বদল ---------- */
function go(n){
  curPage=n;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  $('p'+n).classList.add('active'); $('t'+n).classList.add('active');
  if(n>=2 && !lyrics.length) parseLyrics();
}

/* ---------- গান ---------- */
af.onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  if(audioUrl) URL.revokeObjectURL(audioUrl);
  audioUrl=URL.createObjectURL(f); audio.src=audioUrl; audio.style.display='block';
  $('audioInfo').innerText='✅ '+f.name+' ('+(f.size/1024/1024).toFixed(1)+'MB)';
  audio.load();
};
audio.addEventListener('error',()=>{ if(audio.getAttribute('src')) alert('গানটা লোড করা যায়নি, অন্য ফাইল চেষ্টা করো'); });
['timeupdate','loadedmetadata','durationchange','seeked'].forEach(ev=>audio.addEventListener(ev,updateTimeUI));
audio.addEventListener('play',()=>{ $('playBtn').innerText='⏸ থামাও'; });
['pause','ended'].forEach(ev=>audio.addEventListener(ev,()=>{ $('playBtn').innerText='▶ চালাও'; }));
function updateTimeUI(){
  const t=audio.currentTime||0, d=audio.duration;
  $('time').innerText=format(t)+' / '+format(d);
  $('prog').style.width=(isFinite(d)&&d>0?t/d*100:0)+'%';
}

/* ---------- লিরিক ---------- */
function parseLyrics(){
  const nl=$('ly').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const old=lyrics, oldT=times;
  // একই লাইন একই জায়গায় থাকলে আগের সিংক টাইম রেখে দেয়
  times=nl.map((l,i)=> (old[i]===l && oldT[i]!=null) ? oldT[i] : null);
  lyrics=nl; curIdx=0;
  if(lyrics.length) $('lineCount').innerText='✅ '+lyrics.length+' লাইন লোড হয়েছে';
  renderSync(); store('lyrics',lyrics); store('times',times);
}
function loadLyrics(){ parseLyrics(); if(!lyrics.length){ alert('আগে কিছু লিরিক লেখো'); return; } go(2); }

function renderSync(){
  $('syncList').innerHTML=lyrics.map((l,i)=>{
    const short=l.length>30?l.slice(0,30)+'…':l;
    const tm=times[i]==null?'—':times[i].toFixed(1)+'s';
    return '<div style="padding:6px 0;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;gap:8px;'+(i===curIdx-1?'color:var(--accent2)':'')+'"><span>'+(i+1)+'. '+esc(short)+'</span><span style="color:#8a97b8;white-space:nowrap">'+tm+'</span></div>';
  }).join('');
  $('lineInfo').innerText='লাইন '+curIdx+'/'+lyrics.length;
  $('nextLine').innerText = curIdx<lyrics.length ? 'পরের লাইন: '+lyrics[curIdx] : (lyrics.length?'সব লাইন মার্ক হয়েছে ✅':'');
}

/* ---------- প্লে / সিংক ---------- */
function togglePlay(){
  if(!audio.getAttribute('src')){ alert('আগে গান বাছাই করো'); return; }
  if(audio.paused) audio.play().catch(()=>alert('গান চালানো যায়নি')); else audio.pause();
}
function restart(){
  if(!audio.getAttribute('src')){ alert('আগে গান বাছাই করো'); return; }
  audio.currentTime=0; curIdx=0; renderSync(); audio.play().catch(()=>{});
}
function markLine(){
  if(!audio.getAttribute('src')){ alert('আগে গান বাছাই করো'); return; }
  if(!lyrics.length){ alert('আগে লিরিক নিশ্চিত করো'); return; }
  if(curIdx>=lyrics.length) return; // সব লাইন হয়ে গেছে; আবার করতে "শুরু থেকে" চাপো
  times[curIdx]=audio.currentTime; curIdx++;
  renderSync(); store('times',times);
}
function adjust(d){
  if(curIdx>0 && times[curIdx-1]!=null){ times[curIdx-1]=Math.max(0,times[curIdx-1]+d); renderSync(); store('times',times); }
}
function autoSync(){
  if(!lyrics.length){ alert('আগে লিরিক নিশ্চিত করো'); return; }
  const D=audio.duration;
  if(!D||!isFinite(D)){ alert('গান লোড হয়নি, duration পাওয়া যায়নি'); return; }
  let lead=3, tail=3, total=D-lead-tail;
  if(total<=0){ lead=0; total=D; }
  const per=total/lyrics.length;
  times=lyrics.map((_,i)=>lead+i*per);
  renderSync(); store('times',times);
  $('syncMsg').innerText='✅ শুরুর/শেষের ৩ সেকেন্ড বাদ দিয়ে সমান ভাগে ভাগ হয়েছে';
}
// যে লাইনের টাইম এখনকার সময়ের ঠিক আগে/সমান সেটাই বর্তমান লাইন
function lineAt(t){
  let idx=-1;
  for(let i=0;i<times.length;i++){
    if(times[i]!=null && times[i]<=t && (idx<0 || times[i]>=times[idx])) idx=i;
  }
  return idx;
}

/* ---------- ব্যাকগ্রাউন্ড / ডিজাইন ---------- */
$('bgFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  if(bgMedia && bgMedia.pause) bgMedia.pause();
  if(bgUrl) URL.revokeObjectURL(bgUrl);
  bgUrl=URL.createObjectURL(f);
  if(f.type.startsWith('video')){
    const v=document.createElement('video');
    v.muted=true; v.loop=true; v.playsInline=true; v.src=bgUrl;
    bgMedia=v; setBg('video');
  } else {
    const img=new Image();
    img.onload=()=>{ bgMedia=img; setBg('image'); };
    img.src=bgUrl;
  }
  e.target.value='';
};
function setBg(t){
  bgType=t;
  if(bgMedia && bgMedia.tagName==='VIDEO'){ if(t==='video') bgMedia.play().catch(()=>{}); else bgMedia.pause(); }
  $('bgRainBtn').classList.toggle('sel',t==='rain');
  $('bgFileBtn').classList.toggle('sel',t!=='rain');
}
function setRatio(r){
  ratio=r;
  const [w,h]=PREV[r];
  ['c2','c3'].forEach(id=>{ const c=$(id); c.width=w; c.height=h; });
  document.querySelectorAll('.preview').forEach(p=>{
    p.style.aspectRatio=w+'/'+h;
    p.style.maxWidth = r==='16:9' ? '' : (r==='9:16' ? '240px' : '340px');
    p.style.margin='0 auto';
  });
  [['16:9','r169'],['9:16','r916'],['1:1','r11']].forEach(([v,id])=>$(id).classList.toggle('sel',v===r));
  updateDesign();
}
function ensureFonts(){
  if(!document.fonts||!document.fonts.load) return;
  ['Hind Siliguri','Baloo Da 2','Noto Serif Bengali'].forEach(f=>document.fonts.load('700 32px "'+f+'"','অআকখ').catch(()=>{}));
}
function updateDesign(){
  ensureFonts();
  store('design',{fontSize:$('fontSize').value,darkness:$('darkness').value,font:$('fontSel').value,ratio:ratio,intro:$('intro').value,outro:$('outro').value});
}

/* ---------- ছবি আঁকা (প্রিভিউ, ভিডিও আর থাম্বনেইল সবখানে একই ফাংশন) ---------- */
const drops=Array.from({length:140},()=>({x:Math.random(),y:Math.random(),s:0.6+Math.random()*0.9,l:0.03+Math.random()*0.05}));
function drawCover(ctx,src,w,h){
  if(src.tagName==='VIDEO' && src.readyState<2) return;
  const sw=src.videoWidth||src.naturalWidth||src.width, sh=src.videoHeight||src.naturalHeight||src.height;
  if(!sw||!sh) return;
  const s=Math.max(w/sw,h/sh), dw=sw*s, dh=sh*s;
  try{ ctx.drawImage(src,(w-dw)/2,(h-dh)/2,dw,dh); }catch(e){}
}
function drawBg(ctx,w,h,k){
  if(bgType==='rain' || !bgMedia){
    const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'#0a1230'); g.addColorStop(1,'#04060f');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    const now=performance.now()/1000;
    ctx.strokeStyle='rgba(190,210,255,0.35)'; ctx.lineWidth=Math.max(1,k); ctx.beginPath();
    drops.forEach(d=>{
      const y=(d.y+now*d.s*0.8)%1, x=((d.x-y*0.08)%1+1)%1;
      ctx.moveTo(x*w,y*h); ctx.lineTo((x-0.01)*w,(y+d.l)*h);
    });
    ctx.stroke();
  } else {
    ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
    drawCover(ctx,bgMedia,w,h);
  }
  ctx.fillStyle='rgba(0,0,0,'+($('darkness').value/100)+')'; ctx.fillRect(0,0,w,h);
}
function wrapText(ctx,text,maxW){
  const words=text.split(/\s+/), lines=[]; let cur='';
  words.forEach(w=>{
    const test=cur?cur+' '+w:w;
    if(cur && ctx.measureText(test).width>maxW){ lines.push(cur); cur=w; } else cur=test;
  });
  if(cur) lines.push(cur);
  return lines;
}
function drawText(ctx,w,h,k,text,kind){
  if(!text) return;
  const font=$('fontSel').value||'Hind Siliguri';
  const base=(+$('fontSize').value||32)*(kind==='title'?1.25:1);
  const maxW=w*0.84, maxH=h*0.8;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  let size=base*k, lines=[];
  for(;;){ // লেখা বড় হলে নিজে নিজে ছোট হবে (অটো-শ্রিংক)
    ctx.font='700 '+size+'px "'+font+'","Hind Siliguri",sans-serif';
    lines=wrapText(ctx,text,maxW);
    const fits=lines.length*size*1.35<=maxH && lines.every(l=>ctx.measureText(l).width<=maxW);
    if(fits || size<=10*k) break;
    size-=2*k;
  }
  ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=14*k;
  ctx.fillStyle = kind==='title' ? '#ffb347' : '#ffffff';
  const lh=size*1.35, y0=h/2-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,w/2,y0+i*lh));
  ctx.shadowBlur=0;
}
function drawScene(ctx,w,h,text,kind){
  const k=Math.min(w,h)/360;
  drawBg(ctx,w,h,k);
  drawText(ctx,w,h,k,text,kind||'lyric');
}
function previewText(){
  const idx=lineAt(audio.currentTime||0);
  if(idx>=0) return lyrics[idx];
  if(!times.some(t=>t!=null)) return lyrics[0]||''; // সিংক না থাকলে নমুনা হিসেবে প্রথম লাইন
  return '';
}
function loop(){
  requestAnimationFrame(loop);
  if(curPage!==2 && curPage!==3) return;
  const c=$(curPage===2?'c2':'c3');
  drawScene(c.getContext('2d'),c.width,c.height,previewText(),'lyric');
}

/* ---------- ভিডিও রেকর্ডিং ---------- */
let rec=null, recTimer=null, recChunks=[], recState=null, recUrl=null, lastBlob=null, lastExt='webm';
let audioCtx=null, aSrc=null, aDest=null;
function ensureAudioGraph(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    audioCtx=new AC();
    aSrc=audioCtx.createMediaElementSource(audio); // একটা audio এলিমেন্টে শুধু একবারই করা যায়
    aDest=audioCtx.createMediaStreamDestination();
    aSrc.connect(aDest); aSrc.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function pickMime(){
  const c=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
  return c.find(m=>MediaRecorder.isTypeSupported(m))||'';
}
async function makeVideo(){
  if(rec){ stopRecording(); return; }
  if(!audio.getAttribute('src')){ alert('আগে গান বাছাই করো'); return; }
  if(!lyrics.length) parseLyrics();
  if(!lyrics.length){ alert('আগে লিরিক লেখো'); return; }
  if(!times.some(t=>t!=null) && !confirm('এখনো সিংক করা হয়নি, তাই ভিডিওতে লিরিক আসবে না। তবুও বানাবে?')) return;
  const D=audio.duration;
  if(!D||!isFinite(D)){ alert('গান লোড হয়নি, একটু অপেক্ষা করে আবার চাপো'); return; }
  if(typeof MediaRecorder==='undefined'||!HTMLCanvasElement.prototype.captureStream){ alert('এই ডিভাইসে ভিডিও রেকর্ডিং সাপোর্ট করে না'); return; }
  try{ ensureAudioGraph(); }catch(e){ alert('অডিও সেটআপ করা যায়নি'); return; }
  ensureFonts(); try{ await document.fonts.ready; }catch(e){}

  const [W,H]=EXPORT[ratio];
  const rc=document.createElement('canvas'); rc.width=W; rc.height=H;
  const stream=rc.captureStream(30);
  aDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const mime=pickMime();
  let mr;
  try{ mr=new MediaRecorder(stream, mime?{mimeType:mime,videoBitsPerSecond:5000000}:undefined); }
  catch(e){ alert('রেকর্ডার চালু করা যায়নি'); return; }

  const introText=$('intro').value.trim(), outroText=$('outro').value.trim();
  recState={phase:'intro',t0:performance.now(),t1:0,D:D,W:W,H:H,ctx:rc.getContext('2d'),
    introText:introText,outroText:outroText,introDur:introText?3:0,outroDur:outroText?3:0};
  recChunks=[]; rec=mr;
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
  mr.onstop=()=>{
    const type=((mr.mimeType||mime||'video/webm').split(';')[0]);
    const blob=new Blob(recChunks,{type:type});
    rec=null; recState=null; lastBlob=blob; lastExt=type.includes('mp4')?'mp4':'webm';
    $('mkBtn').innerText='🎬 ভিডিও বানাও'; $('vprog').style.width='100%';
    if(recUrl) URL.revokeObjectURL(recUrl);
    recUrl=URL.createObjectURL(blob);
    const v=$('rv'); v.src=recUrl; v.style.display='block';
    const dl=$('dl'); dl.href=recUrl; dl.download='lyric-video.'+lastExt; dl.style.display='flex';
    $('shareBtn').style.display=(navigator.canShare&&navigator.canShare({files:[new File([blob],'lyric-video.'+lastExt,{type:type})]}))?'flex':'none';
    $('vstatus').innerText='✅ ভিডিও তৈরি হয়েছে ('+(blob.size/1024/1024).toFixed(1)+'MB)';
  };
  audio.pause(); audio.currentTime=0;
  $('rv').style.display='none'; $('dl').style.display='none'; $('shareBtn').style.display='none';
  $('mkBtn').innerText='⏹ রেকর্ড বন্ধ করো';
  mr.start(1000);
  recTimer=setInterval(recFrame,1000/30);
}
function recFrame(){
  const s=recState; if(!s) return;
  const now=performance.now(), total=s.introDur+s.D+s.outroDur;
  let text='', kind='lyric', prog=0;
  if(s.phase==='intro'){
    if(now-s.t0>=s.introDur*1000){
      s.phase='song'; audio.currentTime=0;
      audio.play().catch(()=>{ alert('গান চালানো যায়নি'); stopRecording(); });
    } else { text=s.introText; kind='title'; prog=(now-s.t0)/1000; }
  }
  if(s.phase==='song'){
    if(audio.ended){ s.phase='outro'; s.t1=now; }
    else { const t=audio.currentTime||0, i=lineAt(t); text=i>=0?lyrics[i]:''; prog=s.introDur+t; }
  }
  if(s.phase==='outro'){
    if(now-s.t1>=s.outroDur*1000){ stopRecording(); return; }
    text=s.outroText; kind='title'; prog=s.introDur+s.D+(now-s.t1)/1000;
  }
  drawScene(s.ctx,s.W,s.H,text,kind);
  const pct=Math.min(100,prog/total*100);
  $('vprog').style.width=pct+'%';
  $('vstatus').innerText='🔴 রেকর্ড চলছে… '+Math.floor(pct)+'% (অ্যাপ খোলা রাখো, স্ক্রিন বন্ধ কোরো না)';
}
function stopRecording(){
  if(!rec) return;
  clearInterval(recTimer); recTimer=null;
  audio.pause();
  try{ rec.stop(); }catch(e){}
}
async function shareVideo(){
  if(!lastBlob) return;
  try{ await navigator.share({files:[new File([lastBlob],'lyric-video.'+lastExt,{type:lastBlob.type})]}); }catch(e){}
}

/* ---------- LRC / প্রজেক্ট / থাম্বনেইল / টেস্ট ---------- */
function saveLRC(){
  const lines=[];
  lyrics.forEach((l,i)=>{ if(times[i]!=null) lines.push(lrcTime(times[i])+l); });
  if(!lines.length){ alert('এখনো কোনো লাইন সিংক করা হয়নি'); return; }
  const lrc=lines.join('\n')+'\n';
  const box=$('lrcOut'); box.value=lrc; box.style.display='block'; // ডাউনলোড না হলে এখান থেকে কপি করা যাবে
  saveBlob(new Blob([lrc],{type:'text/plain'}),'lyrics.lrc');
}
function saveProject(){
  const a=store('lyrics',lyrics), b=store('times',times);
  updateDesign();
  alert(a&&b ? '✅ প্রজেক্ট সেভ হয়েছে' : '⚠️ সেভ করা যায়নি (ব্রাউজারে স্টোরেজ বন্ধ থাকতে পারে)');
}
function makeThumbnail(){
  const c=$('thumb'), cx=c.getContext('2d');
  drawScene(cx,1280,720,lyrics[0]||'Lyric','lyric');
  c.style.display='block'; // ডাউনলোড না হলে ছবিতে চেপে ধরে সেভ করা যাবে
  c.toBlob(b=>{ if(b) saveBlob(b,'thumbnail.jpg'); },'image/jpeg',0.9);
}
function testAll(){
  const row=(n,ok,extra)=>n+': '+(ok?'OK':'FAIL'+(extra?' - '+extra:''))+'<br>';
  let ls=false; try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); ls=true; }catch(e){}
  let cv=false; try{ cv=!!document.createElement('canvas').getContext('2d'); }catch(e){}
  $('testResult').innerHTML=
    row('Lyrics',lyrics.length>0,'লিরিক নিশ্চিত করো')+
    row('Audio',!!audio.getAttribute('src'),'গান বাছাই করো')+
    row('Times',times.some(t=>t!=null),'সিংক বা অটো ভাগ করো')+
    row('Canvas',cv)+
    row('localStorage',ls)+
    row('Video Recorder',typeof MediaRecorder!=='undefined'&&!!HTMLCanvasElement.prototype.captureStream);
}

/* ---------- শুরুতে সেভ করা ডেটা ফেরত আনা ---------- */
(function init(){
  const sl=load('lyrics',null);
  if(Array.isArray(sl)&&sl.length){
    lyrics=sl.map(String);
    const st=load('times',[]);
    times=lyrics.map((_,i)=>(typeof st[i]==='number'&&isFinite(st[i])&&st[i]>0)?st[i]:null);
    $('ly').value=lyrics.join('\n');
  }
  const d=load('design',null);
  if(d){
    if(d.fontSize) $('fontSize').value=d.fontSize;
    if(d.darkness) $('darkness').value=d.darkness;
    if(d.font) $('fontSel').value=d.font;
    if(d.intro!=null) $('intro').value=d.intro;
    if(d.outro!=null) $('outro').value=d.outro;
    ratio=PREV[d.ratio]?d.ratio:'16:9';
  }
  setRatio(ratio); setBg('rain'); renderSync(); ensureFonts(); loop();
})();
</script>
