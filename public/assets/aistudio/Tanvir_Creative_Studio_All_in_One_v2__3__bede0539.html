};const $=i=>document.getElementById(i);const loaded={};
function load(id){if(loaded[id])return;loaded[id]=1;const k={f1:'p1',f2:'p2',f3:'p3',f4:'p4'}[id];const bin=atob(D[k].join('')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);$(id).srcdoc=new TextDecoder().decode(u)}
let page='1';
function show(){const id='f'+page;load(id);document.querySelectorAll('iframe').forEach(f=>f.classList.toggle('on',f.id===id));
if(page!=='4'){try{$('f4').contentWindow.pauseAll()}catch(e){}}
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===page));try{sessionStorage.setItem('tcs',page)}catch(e){}}
$('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;page=b.dataset.p;show()};
try{page=sessionStorage.getItem('tcs')||'1';if(!['1','2','3','4'].includes(page))page='1'}catch(e){}show();
</script></body></html>
