</head><body><div class="w">

<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
$('cr').value=$('cr').value.replace(/&amp;/g,'&');
let mode='intro',ratio='169',t0=performance.now(),exporting=false,tabActive=true,rafId=0;
const DUR={intro:8.5,outro:10};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-cl(x),3),seg=(t,a,b)=>cl((t-a)/(b-a));
const FONT='"Roboto","Hind Siliguri",sans-serif',BN='"Hind Siliguri","Noto Sans Bengali",sans-serif';
function setSize(){if(ratio==='169'){cv.width=1920;cv.height=1080;cv.style.maxWidth='none'}else{cv.width=1080;cv.height=1920;cv.style.maxWidth='270px'}}
function T(s,x,y,size,col,a,w,f,sh){ctx.save();ctx.globalAlpha=cl(a);ctx.font=`${w||700} ${size}px ${f||FONT}`;
 while(ctx.measureText(s).width>cv.width*.92&&size>14){size-=2;ctx.font=`${w||700} ${size}px ${f||FONT}`}
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col;if(sh){ctx.shadowColor=sh;ctx.shadowBlur=size*.3}ctx.fillText(s,x,y);ctx.restore()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill()}
let smokeStyle='blue';
function bg(t,g){
 const W=cv.width,H=cv.height;
 ctx.globalAlpha=1;ctx.fillStyle='#05060b';ctx.fillRect(0,0,W,H);
 let pal;
 if(smokeStyle==='silver') pal={a:[145,170,205],b:[205,215,230],c:[58,85,125]};
 else if(smokeStyle==='amber') pal={a:[205,105,42],b:[255,190,95],c:[110,55,28]};
 else pal={a:[55,125,245],b:[245,177,66],c:[38,65,125]};
 // Low-contrast center keeps lyric text readable.
 const base=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.72);
 base.addColorStop(0,`rgba(8,10,18,${.98})`);
 base.addColorStop(1,`rgba(2,3,7,1)`);
 ctx.fillStyle=base;ctx.fillRect(0,0,W,H);
 // Soft side lights, kept away from the text-safe center.
 [[W*.08,pal.a,-.35],[W*.92,pal.b,.35]].forEach(([x,c,dr],i)=>{
   const lx=x+Math.sin(t*.35+i)*W*.025;
   const lg=ctx.createLinearGradient(lx,0,lx+dr*W,H*.92);
   lg.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${.17*g})`);
   lg.addColorStop(.55,`rgba(${c[0]},${c[1]},${c[2]},${.06*g})`);
   lg.addColorStop(1,'rgba(0,0,0,0)');
   ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
 });
 // Layered translucent ellipses imitate slow, organic volumetric smoke rising from below.
 for(let i=0;i<34;i++){
   const side=i%2===0?0:1;
   const seed=i*12.9898;
   const rise=((t*(18+(i%5)*5)+i*61)%Math.max(H*1.15,1));
   const y=H-rise+H*.16;
   const xBase=side?W*(.58+(i%7)*.055):W*(.42-(i%7)*.055);
   const x=xBase+Math.sin(t*.42+i*1.7)*W*(.025+(i%4)*.009);
   const rx=W*(.045+(i%5)*.018), ry=H*(.018+(i%4)*.013);
   const color=(i%3===0)?pal.b:((i%3===1)?pal.a:pal.c);
   const alpha=(.018+(i%4)*.006)*g;
   ctx.save();
   ctx.translate(x,y);
   ctx.rotate(Math.sin(t*.22+i)*.45);
   const grad=ctx.createRadialGradient(0,0,ry*.08,0,0,Math.max(rx,ry)*1.7);
   grad.addColorStop(0,`rgba(${color[0]},${color[1]},${color[2]},${alpha})`);
   grad.addColorStop(.45,`rgba(${color[0]},${color[1]},${color[2]},${alpha*.55})`);
   grad.addColorStop(1,'rgba(0,0,0,0)');
   ctx.fillStyle=grad;
   ctx.scale(1,Math.max(.55,ry/rx));
   ctx.beginPath();ctx.arc(0,0,rx,0,Math.PI*2);ctx.fill();
   ctx.restore();
 }
 // Fine drifting particles, restrained so lyrics stay clear.
 for(let i=0;i<28;i++){
   const px=(i*97%100)/100*W;
   const py=((i*53%100)/100*H+t*12*(1+i%3))%H;
   ctx.fillStyle=`rgba(220,225,245,${.045*g})`;
   ctx.beginPath();ctx.arc(px,py,1+(i%2),0,Math.PI*2);ctx.fill();
 }
}
function intro(t){const W=cv.width,H=cv.height,u=W>H?1:.62,cx=W/2;bg(t,ease(seg(t,0,3)));const fo=1-seg(t,8,8.5);
T("TANVIR'S CREATIVE STUDIO PRESENTS",cx,H*.12,26*u,'#e8c47a',seg(t,.8,1.6)*fo,500);
const a=ease(seg(t,1.4,2.3)),b=ease(seg(t,1.8,2.7));
T("TANVIR'S",cx,H*.2-(1-a)*20,78*u,'#fff',a*fo,900,FONT,'#4a90ff');
T("CREATION",cx,H*.2+84*u-(1-b)*20,78*u,'#f5b942',b*fo,900,FONT,'#ff8a00');
const ti=$('ti').value.trim();if(ti)T(ti,cx,H*.46,150*u,'#fff',ease(seg(t,3,4))*fo,700,BN,'#ff6b9d');
const hl=$('hk').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,3);
hl.forEach((s,k)=>T(s,cx,H*.66+k*92*u,74*u,'#ffe3ee',ease(seg(t,4.4+k*.8,5.4+k*.8))*fo,600,BN,'#ff6b9d'))}
function outro(t){t=t<6.5?t*9.6/6.5:9.6+(t-6.5)*4.7/3.5;const W=cv.width,H=cv.height,u=W>H?1:.62,cx=W/2;bg(t,1);const ti=$('ti').value.trim();
 let lines=$('cr').value.split('\n');if(!ti)lines=lines.filter(l=>l.trim()!=='TITLE:'&&l.trim()!=='{TITLE}');
 lines=lines.map(l=>l.replace('{TITLE}',ti));
 const lh=64*u,bh=lines.length*lh;
 if(t<9.8){const top=H+40-seg(t,0,9.5)*(H+bh+80);
  lines.forEach((l,i)=>{const y=top+i*lh,e=cl(Math.min(y,H-y)/(H*.14)),hd=l.trim().endsWith(':');
   T(l,cx,y,(hd?36:46)*u,hd?'#e8c47a':'#fff',e*(1-seg(t,9.3,9.8)),hd?600:700,/[\u0980-\u09FF]/.test(l)?BN:FONT)})}
 if(t<9.6)return;
 const bs=ease(seg(t,9.8,10.5)),done=t>12.25,tap=seg(t,12.1,12.4),bw=560*u,bh2=130*u,by=H*.5;
 T("Please Like • Follow • Subscribe",cx,H*.3,50*u,'#e8c47a',seg(t,9.6,10.4),700);
 ctx.save();ctx.translate(cx,by);const sc=bs*(1+(done?0:Math.sin(t*6)*.04))*(1-.08*Math.sin(tap*Math.PI));ctx.scale(sc,sc);ctx.globalAlpha=bs;
 ctx.shadowColor=done?'rgba(0,0,0,0)':'#f00';ctx.shadowBlur=done?0:40+20*Math.sin(t*6);ctx.fillStyle=done?'#3a3d4a':'#e60000';rr(-bw/2,-bh2/2,bw,bh2,bh2/2);
 ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font=`900 ${50*u}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(done?'SUBSCRIBED ✓':'▶  SUBSCRIBE',0,0);ctx.restore();
 ctx.save();ctx.translate(cx+bw/2+95*u,by-30*u);ctx.rotate(done?Math.sin((t-12.25)*22)*.5*Math.max(0,1-(t-12.25)/1.6):0);ctx.globalAlpha=bs;ctx.font=`${90*u}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('🔔',0,0);ctx.restore();
 const fb=ease(seg(t,10.6,11.3));ctx.save();ctx.globalAlpha=fb;ctx.fillStyle='#1877f2';rr(cx-bw*.36,H*.64-55*u,bw*.72,110*u,55*u);ctx.restore();
 T('f  FOLLOW',cx,H*.64,46*u,'#fff',fb,900);
 const ca=seg(t,11.2,12.1)*(1-seg(t,12.6,13));if(ca>0){const k=ease(seg(t,11.2,12.1)),x=cx+W*.22*(1-k)+bw*.15,y=by+H*.22*(1-k)+bh2*.2;ctx.save();ctx.globalAlpha=ca;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,24*u,0,7);ctx.fill();if(tap>0){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,24*u+tap*50*u,0,7);ctx.stroke()}ctx.restore()}
 T('THANK YOU FOR LISTENING ♥',cx,H*.78,46*u,'#fff',seg(t,13.2,14),700);
 T('youtube.com/@tanvirrahmanrony1',cx,H*.87,32*u,'#9fb8ff',seg(t,13.6,14.3),500)}
function frame(now){if(!tabActive&&!exporting){rafId=0;return}const d=DUR[mode],t=exporting?(now-t0)/1000:((now-t0)/1000)%(d+1);(mode==='intro'?intro:outro)(Math.min(t,d));rafId=requestAnimationFrame(frame)}
window.setTabActive=function(on){tabActive=Boolean(on);if(tabActive&&!rafId){t0=performance.now();rafId=requestAnimationFrame(frame);}};
window.pauseAll=function(){if(!exporting){tabActive=false;}};
function pick(g,id){g.forEach(x=>$(x).classList.toggle('on',x===id))}
$('m_intro').onclick=()=>{mode='intro';pick(['m_intro','m_outro'],'m_intro');t0=performance.now()};
$('m_outro').onclick=()=>{mode='outro';pick(['m_intro','m_outro'],'m_outro');t0=performance.now()};
$('r_169').onclick=()=>{ratio='169';pick(['r_169','r_916'],'r_169');setSize();t0=performance.now()};
$('r_916').onclick=()=>{ratio='916';pick(['r_169','r_916'],'r_916');setSize();t0=performance.now()};
$('sm_blue').onclick=()=>{smokeStyle='blue';pick(['sm_blue','sm_silver','sm_amber'],'sm_blue');t0=performance.now()};
$('sm_silver').onclick=()=>{smokeStyle='silver';pick(['sm_blue','sm_silver','sm_amber'],'sm_silver');t0=performance.now()};
$('sm_amber').onclick=()=>{smokeStyle='amber';pick(['sm_blue','sm_silver','sm_amber'],'sm_amber');t0=performance.now()};
$('ex').onclick=async()=>{if(exporting)return;exporting=true;$('ex').disabled=true;$('out').innerHTML='';$('st').textContent='রেকর্ডিং চলছে… স্ক্রিন অন রাখুন, অ্যাপ বদলাবেন না';
 let wl;try{wl=await navigator.wakeLock.request('screen')}catch(e){}
 const ty=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'],mt=ty.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||'';
 const rec=new MediaRecorder(cv.captureStream(30),{mimeType:mt||undefined,videoBitsPerSecond:8e6}),ch=[];
 rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
 let lastBlob=null,lastName='',lastMime='video/webm';
function getBridge(){try{if(window.AndroidBridge&&typeof window.AndroidBridge.startFileSave==='function')return window.AndroidBridge}catch(e){}try{if(parent&&parent!==window&&parent.AndroidBridge&&typeof parent.AndroidBridge.startFileSave==='function')return parent.AndroidBridge}catch(e){}return null}
function downloadVideoMulti(blob,name){
  if(!blob||!blob.size){$('st').textContent='ডাউনলোড করার মতো ভিডিও নেই।';return}
  const b=getBridge();
  if(b){
    $('st').textContent='ফোনের Downloads/TanvirCreativeStudio ফোল্ডারে সেভ হচ্ছে…';
    const r=new FileReader();
    r.onloadend=()=>{try{const res=String(r.result||''),b64=res.indexOf(',')>=0?res.split(',')[1]:res;const id=b.startFileSave(name,blob.type||'video/webm');for(let i=0;i<b64.length;i+=262144)b.appendFileChunk(id,b64.slice(i,i+262144));b.finishFileSave(id);$('st').textContent='সেভ সম্পন্ন! Downloads/TanvirCreativeStudio/'+name}catch(e){$('st').textContent='সেভ ব্যর্থ: '+(e.message||e)}};
    r.readAsDataURL(blob);return;
  }
  try{if(parent&&parent!==window&&parent.__TCS_HAS_ANDROID_BRIDGE__){$('st').textContent='ফোনের Downloads ফোল্ডারে সেভ হচ্ছে…';const r=new FileReader();r.onloadend=()=>{const res=String(r.result||''),b64=res.indexOf(',')>=0?res.split(',')[1]:res;parent.postMessage({type:'TCS_SAVE_FILE',name,mime:blob.type||'video/webm',base64:b64},'*')};r.readAsDataURL(blob);return}}catch(e){}
  try{if(parent&&parent!==window&&typeof parent.__TCS_TRIGGER_DOWNLOAD__==='function'){parent.__TCS_TRIGGER_DOWNLOAD__(blob,name);$('st').textContent='ডাউনলোড শুরু হয়েছে: '+name+' (না হলে বিকল্প ডাউনলোড চাপুন)';return}}catch(e){}
  if(parent&&parent!==window){
    try{
      const r=new FileReader();
      r.onloadend=()=>{const buf=r.result;try{if(buf instanceof ArrayBuffer){parent.postMessage({type:'TCS_DOWNLOAD_FILE',name,mime:blob.type||'application/octet-stream',buffer:buf},'*',[buf]);return}}catch(e){}try{parent.postMessage({type:'TCS_DOWNLOAD_FILE',name,mime:blob.type||'application/octet-stream',buffer:buf},'*')}catch(e2){}};
      r.readAsArrayBuffer(blob);
      $('st').textContent='ডাউনলোড শুরু হয়েছে: '+name+' (না হলে বিকল্প ডাউনলোড চাপুন)';
      return;
    }catch(e){}
  }
  const u=URL.createObjectURL(new Blob([blob],{type:'application/octet-stream'}));
  const a=document.createElement('a');a.href=u;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{try{a.remove()}catch(e){}try{URL.revokeObjectURL(u)}catch(e){}},60000);
  $('st').textContent='ডাউনলোড শুরু হয়েছে: '+name;
}
function downloadVideoAlt(blob,name){
  if(!blob||!blob.size)return;
  if(getBridge()){downloadVideoMulti(blob,name);return}
  $('st').textContent='বিকল্প ডাউনলোড (APK / WebView) প্রস্তুত হচ্ছে…';
  const r=new FileReader();
  r.onloadend=()=>{
    const dataUrl=String(r.result||'');
    if(!dataUrl||dataUrl.indexOf('data:')!==0){$('st').textContent='ফাইল ডেটা পড়া যায়নি।';return}
    try{
      if(parent&&parent!==window){
        if(typeof parent.__TCS_TRIGGER_DATA_URL__==='function'){parent.__TCS_TRIGGER_DATA_URL__(dataUrl,name);$('st').textContent='বিকল্প ডাউনলোড পাঠানো হয়েছে: '+name;return}
        parent.postMessage({type:'TCS_DOWNLOAD_DATA_URL',name,dataUrl},'*');$('st').textContent='বিকল্প ডাউনলোড পাঠানো হয়েছে: '+name;return;
      }
    }catch(e){}
    const a=document.createElement('a');a.href=dataUrl;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(()=>{try{a.remove()}catch(e){}},4000);
    $('st').textContent='বিকল্প ডাউনলোড শুরু হয়েছে: '+name;
  };
  r.readAsDataURL(new Blob([blob],{type:'application/octet-stream'}));
}
rec.onstop=()=>{const ext=mt.includes('mp4')?'mp4':'webm';lastMime=(mt||'video/webm').split(';')[0];lastBlob=new Blob(ch,{type:lastMime});
  if(!lastBlob.size){$('st').textContent='ভিডিও ডেটা তৈরি হয়নি — আবার চেষ্টা করুন।';exporting=false;$('ex').disabled=false;try{wl&&wl.release()}catch(e){}return}
  lastName=`${mode}-${Date.now()}.${ext}`;const u=URL.createObjectURL(lastBlob);
  const canSh=typeof navigator.share==='function';
  $('out').innerHTML=`<video src="${u}" controls playsinline></video><a class="d" id="dlIntroBtn" href="${u}" download="${lastName}">⬇ ডাউনলোড (${ext.toUpperCase()})</a><button type="button" class="b" id="dlIntroAltBtn" style="width:100%;margin-top:8px">📥 বিকল্প ডাউনলোড (APK / WebView)</button>`+(canSh?`<button type="button" class="b" id="shIntroBtn" style="width:100%;margin-top:8px">📤 শেয়ার / ফোনে সেভ করো</button>`:'')+`<div style="font-size:11px;opacity:.7;margin-top:8px;line-height:1.5">টিপস: সরাসরি ডাউনলোড না হলে বিকল্প ডাউনলোড বা শেয়ার বাটন চাপুন, অথবা ভিডিওর ⋮ মেনু থেকে Download করুন।</div>`;
