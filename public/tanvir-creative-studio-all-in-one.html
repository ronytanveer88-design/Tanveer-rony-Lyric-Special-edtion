function saveViaAndroidBridge(blob,name,mime){
  if(!(window.AndroidBridge&&typeof window.AndroidBridge.startFileSave==='function')) return false;
  try{
    const r=new FileReader();
    r.onloadend=()=>{
      try{
        const res=String(r.result||'');
        const b64=res.indexOf(',')>=0?res.split(',')[1]:res;
        const id=window.AndroidBridge.startFileSave(name||'studio-file',mime||blob.type||'application/octet-stream');
        for(let i=0;i<b64.length;i+=262144) window.AndroidBridge.appendFileChunk(id,b64.slice(i,i+262144));
        window.AndroidBridge.finishFileSave(id);
      }catch(e){}
    };
    r.readAsDataURL(blob);
    return true;
  }catch(e){return false;}
}
function triggerTopBlobDownload(blob,name){
  if(saveViaAndroidBridge(blob,name,blob.type)) return;
  const dlBlob=new Blob([blob],{type:'application/octet-stream'});
  const u=URL.createObjectURL(dlBlob);
  const a=document.createElement('a');
  a.href=u;a.download=name||'studio-file';a.rel='noopener';a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{try{a.remove();}catch(e){}try{URL.revokeObjectURL(u);}catch(e){}},60000);
}

  a.href=dataUrl;a.download=name||'studio-file';a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{try{a.remove();}catch(e){}},4000);
}
window.__TCS_TRIGGER_DOWNLOAD__=triggerTopBlobDownload;
window.__TCS_TRIGGER_DATA_URL__=triggerTopDataUrlDownload;
function readParentSnapshot(){
  const snap={};
  try{
    for(const k of STORAGE_KEYS){
      const v=localStorage.getItem(k);
      if(v!=null) snap[k]=v;
    }
  }catch(e){}
  return snap;
}
function injectInitStorage(html){
  const safeJson=JSON.stringify(readParentSnapshot()).replace(/<\//g,'<\\/');
  const tag='<script>window.__TCS_INIT_STORAGE__='+safeJson+';<\/script>';
  const idx=html.indexOf('<head>');
  return idx>=0?(html.slice(0,idx+6)+tag+html.slice(idx+6)):(tag+html);
}
function load(id){
  if(loaded[id])return;
  loaded[id]=1;
  const k={f1:'p1',f2:'p2',f3:'p3',f4:'p4'}[id];
  const bin=atob(D[k].join('')),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const frame=$(id);
  frame.srcdoc=injectInitStorage(new TextDecoder().decode(u));
  if(id==='f4'){
    frame.addEventListener('load',()=>{
      if(pendingLyricsForP4){
        const txt=pendingLyricsForP4;pendingLyricsForP4=null;
        try{frame.contentWindow.postMessage({type:'TCS_IMPORT_LYRICS',text:txt},'*')}catch(e){}
      }
    });
  }
}
let page='4';
function show(){
  const id='f'+page;
  load(id);
  document.querySelectorAll('iframe').forEach(f=>f.classList.toggle('on',f.id===id));
  if(page!=='4'){try{$('f4').contentWindow.pauseAll()}catch(e){}}
  try{if(loaded['f2']&&$('f2').contentWindow&&typeof $('f2').contentWindow.setTabActive==='function')$('f2').contentWindow.setTabActive(page==='2')}catch(e){}
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===page));
  try{sessionStorage.setItem('tcs',page)}catch(e){}
}
$('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;page=b.dataset.p;show()};
window.addEventListener('message',ev=>{
  const msg=ev&&ev.data;
  if(!msg||typeof msg!=='object')return;
  if(msg.type==='TCS_STORAGE_SET'&&typeof msg.key==='string'){
    try{localStorage.setItem(msg.key,String(msg.value??''))}catch(e){}
    document.querySelectorAll('iframe').forEach(f=>{
      try{if(f.contentWindow&&f.contentWindow!==ev.source)f.contentWindow.postMessage({type:'TCS_STORAGE_SYNC',key:msg.key,value:String(msg.value??'')},'*')}catch(e){}
    });
  } else if(msg.type==='TCS_STORAGE_REMOVE'&&typeof msg.key==='string'){
    try{localStorage.removeItem(msg.key)}catch(e){}
    document.querySelectorAll('iframe').forEach(f=>{
      try{if(f.contentWindow&&f.contentWindow!==ev.source)f.contentWindow.postMessage({type:'TCS_STORAGE_SYNC',key:msg.key,value:null},'*')}catch(e){}
    });
  } else if(msg.type==='TCS_SAVE_FILE'&&window.AndroidBridge&&typeof window.AndroidBridge.startFileSave==='function'){
    try{
      const id=window.AndroidBridge.startFileSave(msg.name||'studio-file',msg.mime||'application/octet-stream');
      const b64=String(msg.base64||'');
      for(let i=0;i<b64.length;i+=262144)window.AndroidBridge.appendFileChunk(id,b64.slice(i,i+262144));
      window.AndroidBridge.finishFileSave(id);
    }catch(e){}
  } else if(msg.type==='TCS_DOWNLOAD_FILE'&&msg.buffer){
    const blob=new Blob([msg.buffer],{type:msg.mime||'application/octet-stream'});
    triggerTopBlobDownload(blob,msg.name||'studio-video.webm');
  } else if(msg.type==='TCS_DOWNLOAD_DATA_URL'&&typeof msg.dataUrl==='string'){
    triggerTopDataUrlDownload(msg.dataUrl,msg.name||'studio-video.webm');
  } else if(msg.type==='TCS_SEND_LYRICS_TO_STUDIO'&&typeof msg.text==='string'){
    page='4';
    const wasLoaded=Boolean(loaded['f4']);
    show();
    if(wasLoaded){
      try{$('f4').contentWindow.postMessage({type:'TCS_IMPORT_LYRICS',text:msg.text},'*')}catch(e){}
    } else {
      pendingLyricsForP4=msg.text;
    }
  }
});
window.onAndroidBack=function(){
  try{
    const f=$('f'+page);
    if(f&&f.contentWindow&&typeof f.contentWindow.onAndroidBack==='function'){
      if(f.contentWindow.onAndroidBack())return true;
    }
  }catch(e){}
  if(page!=='4'){page='4';show();return true;}
  return false;
};
try{const s=sessionStorage.getItem('tcs');if(s&&['1','2','3','4'].includes(s))page=s}catch(e){}
show();
</script></body></html>
